<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Strategic 11v11 Football Keyboard</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0f1217;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  canvas {
    display:block;
    width:100vw;
    height:100vh;
    background:#111;
  }
  #start {
    position: fixed;
    inset: 0;
    z-index: 10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:white;
    text-align:center;
    background:
      radial-gradient(circle at 50% 45%, rgba(35,135,85,.45), rgba(13,16,21,.98) 68%),
      linear-gradient(135deg, #16262c, #0b0d12);
  }
  #start .card {
    max-width: 880px;
    padding: 30px 34px;
    border-radius: 30px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
  }
  #start h1 { margin: 0 0 8px; letter-spacing: .04em; }
  #start p { line-height: 1.75; opacity: .92; font-weight: 650; }
  #start small { line-height:1.8; opacity:.78; }
  #start button {
    margin-top: 22px;
    font-size: 24px;
    padding: 16px 34px;
    border-radius: 18px;
    border: none;
    background: #fff;
    color: #111;
    font-weight: 900;
  }
</style>
</head>
<body>
<div id="start">
  <div class="card">
    <h1>KEYBOARD 11v11 FOOTBALL</h1>
    <p>コントローラーを画面から消し、キーボード操作に変更した版です。</p>
    <small>
      青チーム：WASD移動 / Fパス / Gシュート / Q選手切替 / Eスライディング<br>
      赤チーム：矢印キー移動 / Kパス / Lシュート / O選手切替 / Pスライディング<br>
      AIがボールを持った時は、相手ゴールへ前進してパス・シュートを狙うように修正しています。
    </small>
    <br>
    <button onclick="startGame()">KICK OFF</button>
  </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha:false });

let W=0,H=0,scale=1,dpr=1;
const pitch = {x:0,y:0,w:0,h:0};

function resize(){
  dpr = devicePixelRatio || 1;
  W = canvas.width = Math.floor(innerWidth*dpr);
  H = canvas.height = Math.floor(innerHeight*dpr);
  scale = Math.min(W/1280, H/760);
  setupPitch();
}
addEventListener("resize", resize);

function setupPitch(){
  pitch.w = Math.min(W-50*scale, 1180*scale);
  pitch.h = Math.min(H-88*scale, 675*scale);
  pitch.x = (W-pitch.w)/2;
  pitch.y = 34*scale;
}
function fieldX(t){ return pitch.x + pitch.w*t; }
function fieldY(t){ return pitch.y + pitch.h*t; }

const baseFormationL = [
  {role:"GK", x:.055, y:.50, line:"gk"},
  {role:"LB", x:.18, y:.22, line:"def"}, {role:"LCB", x:.17, y:.39, line:"def"},
  {role:"RCB", x:.17, y:.61, line:"def"}, {role:"RB", x:.18, y:.78, line:"def"},
  {role:"CDM", x:.33, y:.50, line:"mid"}, {role:"LCM", x:.39, y:.32, line:"mid"}, {role:"RCM", x:.39, y:.68, line:"mid"},
  {role:"LW", x:.49, y:.25, line:"att"}, {role:"ST", x:.475, y:.50, line:"att"}, {role:"RW", x:.49, y:.75, line:"att"}
];

const baseFormationR = [
  {role:"GK", x:.945, y:.50, line:"gk"},
  {role:"LB", x:.82, y:.78, line:"def"}, {role:"LCB", x:.83, y:.61, line:"def"},
  {role:"RCB", x:.83, y:.39, line:"def"}, {role:"RB", x:.82, y:.22, line:"def"},
  {role:"CDM", x:.67, y:.50, line:"mid"}, {role:"LCM", x:.61, y:.68, line:"mid"}, {role:"RCM", x:.61, y:.32, line:"mid"},
  {role:"LW", x:.51, y:.75, line:"att"}, {role:"ST", x:.525, y:.50, line:"att"}, {role:"RW", x:.51, y:.25, line:"att"}
];

let players=[], ball={};
let selected={L:9,R:9};
let userSelected={L:9,R:9};
let possession=null;
let scoreL=0, scoreR=0, timeLeft=240, running=false;
let last=0, message="", messageTimer=0, goalFlash=0;
let kickoffTeam="L";

const keys = {};
const pressedOnce = {};

addEventListener("keydown", e=>{
  keys[e.code] = true;
  if(!pressedOnce[e.code]) pressedOnce[e.code] = true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e=>{
  keys[e.code] = false;
});

function consume(code){
  if(pressedOnce[code]){
    pressedOnce[code] = false;
    return true;
  }
  return false;
}

function makePlayer(team, i, f){
  const isGK=f.role==="GK";
  return {
    team, i, role:f.role, line:f.line, fx:f.x, fy:f.y,
    x:fieldX(f.x), y:fieldY(f.y),
    vx:0, vy:0,
    r:isGK ? 13*scale : 11.5*scale,
    maxSpeed:(isGK ? 136 : 158)*scale,
    passCool:0, shootCool:0, slideCool:0, aiDecisionCool:0,
    slideTime:0, slideDx:0, slideDy:0,
    freeze:0,
    facing: team==="L" ? 0 : Math.PI
  };
}

function resetPositions(){
  setupPitch();
  players=[];
  baseFormationL.forEach((f,i)=>players.push(makePlayer("L",i,f)));
  baseFormationR.forEach((f,i)=>players.push(makePlayer("R",i,f)));
  selected.L=9; selected.R=9;
  userSelected.L=9; userSelected.R=9;
  possession=null;

  const blueST = teamPlayers("L")[9];
  const redST = teamPlayers("R")[9];
  if(kickoffTeam==="L"){
    blueST.x=fieldX(.485); blueST.y=fieldY(.50);
    selected.L=9; userSelected.L=9;
    possession=blueST;
  } else {
    redST.x=fieldX(.515); redST.y=fieldY(.50);
    selected.R=9; userSelected.R=9;
    possession=redST;
  }

  ball={x:fieldX(.5), y:fieldY(.5), vx:0, vy:0, r:7.5*scale, spin:0};
}

function teamPlayers(team){ return players.filter(p=>p.team===team); }
function selectedPlayer(team){ return teamPlayers(team)[selected[team]] || teamPlayers(team)[0]; }
function userPlayer(team){ return teamPlayers(team)[userSelected[team]] || teamPlayers(team)[0]; }
function otherTeam(team){ return team==="L" ? "R" : "L"; }
function attackDir(team){ return team==="L" ? 1 : -1; }
function oppGoalX(team){ return team==="L" ? pitch.x+pitch.w : pitch.x; }
function ownGoalX(team){ return team==="L" ? pitch.x : pitch.x+pitch.w; }
function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
function normalize(x,y){ const l=Math.hypot(x,y)||1; return {x:x/l,y:y/l}; }
function setMessage(m,t=1.1){ message=m; messageTimer=t; }

function startGame(){
  document.getElementById("start").style.display="none";
  scoreL=scoreR=0; timeLeft=240; running=true; kickoffTeam="L";
  resetPositions();
  setMessage("KICK OFF",1.3);
  last=performance.now();
  requestAnimationFrame(loop);
}

function getKeyboardControl(team){
  let x=0,y=0;
  if(team==="L"){
    if(keys.KeyA) x-=1;
    if(keys.KeyD) x+=1;
    if(keys.KeyW) y-=1;
    if(keys.KeyS) y+=1;
    return {
      x,y,
      pass:consume("KeyF"),
      shoot:consume("KeyG"),
      sw:consume("KeyQ"),
      slide:consume("KeyE")
    };
  } else {
    if(keys.ArrowLeft) x-=1;
    if(keys.ArrowRight) x+=1;
    if(keys.ArrowUp) y-=1;
    if(keys.ArrowDown) y+=1;
    return {
      x,y,
      pass:consume("KeyK"),
      shoot:consume("KeyL"),
      sw:consume("KeyO"),
      slide:consume("KeyP")
    };
  }
}

let cachedControlL = {x:0,y:0,pass:false,shoot:false,sw:false,slide:false};
let cachedControlR = {x:0,y:0,pass:false,shoot:false,sw:false,slide:false};

function refreshControls(){
  cachedControlL = getKeyboardControl("L");
  cachedControlR = getKeyboardControl("R");
}

function sideControlForTeam(team){
  return team==="L" ? cachedControlL : cachedControlR;
}

function switchUserPlayer(team){
  const arr=teamPlayers(team);
  let best=0, bd=Infinity;
  for(let i=0;i<arr.length;i++){
    const p=arr[i];
    if(p.freeze>0) continue;
    if(p.role==="GK" && ball.x > pitch.x+pitch.w*.16 && team==="L") continue;
    if(p.role==="GK" && ball.x < pitch.x+pitch.w*.84 && team==="R") continue;
    const d=dist2(p,ball);
    if(d<bd){ bd=d; best=i; }
  }
  userSelected[team] = userSelected[team]===best ? (userSelected[team]+1)%arr.length : best;
  selected[team] = userSelected[team];
}

function consumeSwitches(){
  if(cachedControlL.sw) switchUserPlayer("L");
  if(cachedControlR.sw) switchUserPlayer("R");
}

function teamPossessionState(team){
  if(possession && possession.team===team) return "attack";
  if(possession && possession.team!==team) return "defend";
  return "loose";
}

function tacticalTarget(p){
  const dir=attackDir(p.team);
  const baseX=fieldX(p.fx), baseY=fieldY(p.fy);
  const state=teamPossessionState(p.team);

  if(p.role==="GK"){
    const gx=p.team==="L" ? fieldX(.055) : fieldX(.945);
    const danger = p.team==="L" ? ball.x < fieldX(.22) : ball.x > fieldX(.78);
    const gy = danger ? Math.max(fieldY(.39), Math.min(fieldY(.61), ball.y)) : fieldY(.5);
    return {x:gx,y:gy};
  }

  // If this AI has the ball, it must attack the opponent goal, not follow defensive formation.
  if(possession===p){
    return ballCarrierAITarget(p);
  }

  if(state==="attack"){
    let tx=baseX, ty=baseY;
    const ballProgress = p.team==="L" ? (ball.x-pitch.x)/pitch.w : (pitch.x+pitch.w-ball.x)/pitch.w;

    if(p.line==="def"){
      const push = Math.min(.10, Math.max(0, ballProgress-.38)*.20);
      tx = fieldX(p.fx + dir*push);
      ty = baseY;
    }
    if(p.line==="mid"){
      tx = ball.x - dir*(95 + (p.i%3)*18)*scale;
      ty = baseY*.70 + ball.y*.30;
    }
    if(p.line==="att"){
      if(p.role==="ST"){
        tx = ball.x + dir*125*scale;
        ty = fieldY(.50);
      } else {
        tx = ball.x + dir*95*scale;
        ty = baseY*.82 + ball.y*.18;
      }
    }
    return clampToZone(p, tx, ty, state);
  }

  if(state==="defend"){
    const compactX = ball.x*.34 + ownGoalX(p.team)*.66;
    let tx = baseX*.45 + compactX*.55;
    let ty = baseY*.60 + ball.y*.40;

    if(p.line==="def"){
      tx = ownGoalX(p.team)*.72 + ball.x*.28;
      ty = baseY*.70 + ball.y*.30;
    }
    if(p.line==="mid"){
      tx = ownGoalX(p.team)*.55 + ball.x*.45;
      ty = baseY*.55 + ball.y*.45;
    }
    if(p.line==="att"){
      tx = ownGoalX(p.team)*.38 + ball.x*.62;
      ty = baseY*.70 + ball.y*.30;
    }

    const pressers = teamPlayers(p.team)
      .filter(q=>q.role!=="GK" && q!==userPlayer(p.team))
      .sort((a,b)=>dist2(a,ball)-dist2(b,ball));

    if(pressers[0]===p){
      tx = ball.x - dir*18*scale;
      ty = ball.y;
    }
    return clampToZone(p, tx, ty, state);
  }

  const loosePressers = teamPlayers(p.team)
    .filter(q=>q.role!=="GK")
    .sort((a,b)=>dist2(a,ball)-dist2(b,ball));
  if(loosePressers[0]===p || loosePressers[1]===p){
    return {x:ball.x,y:ball.y};
  }

  return {x:baseX,y:baseY};
}

function ballCarrierAITarget(p){
  const dir=attackDir(p.team);
  const goalX=oppGoalX(p.team);
  const goalY=fieldY(.50);
  const progress = p.team==="L" ? (p.x-pitch.x)/pitch.w : (pitch.x+pitch.w-p.x)/pitch.w;

  // Carry diagonally into space, but always toward the opponent goal.
  let laneY = p.y;
  const nearestOpp = nearestOpponent(p);
  if(nearestOpp && Math.sqrt(dist2(p, nearestOpp)) < 70*scale){
    laneY += (p.y < fieldY(.5) ? -50 : 50) * scale;
  }

  if(progress > .78){
    return {x:goalX, y:goalY};
  }

  return {
    x:p.x + dir*130*scale,
    y:Math.max(pitch.y+p.r, Math.min(pitch.y+pitch.h-p.r, laneY*.85 + goalY*.15))
  };
}

function clampToZone(p, tx, ty, state){
  let minX=pitch.x+p.r, maxX=pitch.x+pitch.w-p.r;
  if(state==="attack"){
    if(p.team==="L"){
      if(p.line==="def") maxX=fieldX(.55);
      if(p.line==="mid") maxX=fieldX(.78);
    } else {
      if(p.line==="def") minX=fieldX(.45);
      if(p.line==="mid") minX=fieldX(.22);
    }
  }
  if(state==="defend"){
    if(p.team==="L"){
      if(p.line==="def") maxX=fieldX(.42);
      if(p.line==="mid") maxX=fieldX(.60);
    } else {
      if(p.line==="def") minX=fieldX(.58);
      if(p.line==="mid") minX=fieldX(.40);
    }
  }
  return {
    x:Math.max(minX,Math.min(maxX,tx)),
    y:Math.max(pitch.y+p.r,Math.min(pitch.y+pitch.h-p.r,ty))
  };
}

function movePlayer(p, tx, ty, dt, user=false){
  if(p.freeze>0){
    p.freeze=Math.max(0,p.freeze-dt);
    p.vx*=.55; p.vy*=.55;
    return;
  }

  if(p.slideTime>0){
    p.slideTime=Math.max(0,p.slideTime-dt);
    p.x += p.slideDx * 325*scale*dt;
    p.y += p.slideDy * 325*scale*dt;
    p.vx*=.70; p.vy*=.70;
    p.x=Math.max(pitch.x+p.r, Math.min(pitch.x+pitch.w-p.r, p.x));
    p.y=Math.max(pitch.y+p.r, Math.min(pitch.y+pitch.h-p.r, p.y));
    return;
  }

  let len=Math.hypot(tx,ty);
  if(len>1){ tx/=len; ty/=len; len=1; }
  const accel=(user ? 760 : 500)*scale;
  p.vx += tx*accel*dt;
  p.vy += ty*accel*dt;

  const max=p.maxSpeed*(user ? 1.0 : .90);
  const v=Math.hypot(p.vx,p.vy);
  if(v>max){ p.vx=p.vx/v*max; p.vy=p.vy/v*max; }

  p.vx*=.855; p.vy*=.855;
  p.x+=p.vx*dt; p.y+=p.vy*dt;

  if(Math.hypot(p.vx,p.vy)>6*scale) p.facing=Math.atan2(p.vy,p.vx);

  p.x=Math.max(pitch.x+p.r, Math.min(pitch.x+pitch.w-p.r, p.x));
  p.y=Math.max(pitch.y+p.r, Math.min(pitch.y+pitch.h-p.r, p.y));
}

function playerCollisions(){
  for(let i=0;i<players.length;i++){
    for(let j=i+1;j<players.length;j++){
      const a=players[i], b=players[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.hypot(dx,dy)||1;
      const min=a.r+b.r-1*scale;
      if(d<min){
        const push=(min-d)*.36, nx=dx/d, ny=dy/d;
        a.x-=nx*push; a.y-=ny*push;
        b.x+=nx*push; b.y+=ny*push;
      }
    }
  }
}

function updatePossession(){
  if(possession){
    if(possession.freeze>0){
      possession=null;
      return;
    }

    // User-controlled ball carrier follows keyboard. AI ball carrier follows its own attack direction.
    let dx, dy;
    if(possession===userPlayer(possession.team)){
      const c=sideControlForTeam(possession.team);
      dx=c.x; dy=c.y;
      const l=Math.hypot(dx,dy);
      if(l<.13){ dx=Math.cos(possession.facing); dy=Math.sin(possession.facing); }
      else { dx/=l; dy/=l; possession.facing=Math.atan2(dy,dx); }
    } else {
      const target = ballCarrierAITarget(possession);
      const d = normalize(target.x-possession.x, target.y-possession.y);
      dx=d.x; dy=d.y;
      possession.facing=Math.atan2(dy,dx);
    }

    ball.x=possession.x+dx*(possession.r+ball.r+3*scale);
    ball.y=possession.y+dy*(possession.r+ball.r+3*scale);
    ball.vx=possession.vx*.85; ball.vy=possession.vy*.85;
  } else {
    for(const p of players){
      if(p.freeze>0 || p.slideTime>0) continue;
      if(dist2(p,ball)<(p.r+ball.r+5*scale)**2 && Math.hypot(ball.vx,ball.vy)<235*scale){
        possession=p;
        break;
      }
    }
  }
}

function startSlide(p, c){
  if(p.slideCool>0 || p.freeze>0 || p.role==="GK") return;
  let dx=c.x,dy=c.y;
  const l=Math.hypot(dx,dy);
  if(l<.18){ dx=Math.cos(p.facing); dy=Math.sin(p.facing); }
  else { dx/=l; dy/=l; }
  p.slideDx=dx; p.slideDy=dy;
  p.facing=Math.atan2(dy,dx);
  p.slideTime=.42;
  p.slideCool=1.25;
  p.vx=0; p.vy=0;
}

function handleSlideSteal(){
  if(!possession) return;
  const holder=possession;
  for(const p of players){
    if(p.team===holder.team) continue;
    if(p.slideTime<=0) continue;
    const reach = p.r + holder.r + 8*scale;
    if(dist2(p,holder) < reach*reach){
      holder.freeze=1.05;
      holder.vx=0; holder.vy=0;
      possession=p;
      ball.x=p.x+p.slideDx*(p.r+ball.r+5*scale);
      ball.y=p.y+p.slideDy*(p.r+ball.r+5*scale);
      setMessage("SLIDE STEAL",.8);
      return;
    }
  }
}

function kickBall(p,power,targetX,targetY,curve=0){
  const d=normalize(targetX-p.x,targetY-p.y);
  possession=null;
  ball.x=p.x+d.x*(p.r+ball.r+4*scale);
  ball.y=p.y+d.y*(p.r+ball.r+4*scale);
  ball.vx=d.x*power;
  ball.vy=d.y*power;
  ball.spin=curve;
}

function nearestOpponent(p){
  let best=null, bd=Infinity;
  for(const o of teamPlayers(otherTeam(p.team))){
    const d=dist2(p,o);
    if(d<bd){bd=d; best=o;}
  }
  return best;
}

function nearestOpponentDistance(p){
  const o=nearestOpponent(p);
  return o ? Math.sqrt(dist2(p,o)) : 99999;
}

function passTarget(p){
  const mates=teamPlayers(p.team).filter(q=>q!==p && q.role!=="GK" && q.freeze<=0);
  const left=p.team==="L";
  let best=mates[0], bestScore=-Infinity;
  for(const q of mates){
    const forward=left ? q.x-p.x : p.x-q.x;
    const space=nearestOpponentDistance(q);
    const distance=Math.sqrt(dist2(p,q));
    let score=forward*.72 + space*.42 - Math.abs(q.y-p.y)*.18 - Math.abs(distance-155*scale)*.11;
    if(q.line==="att") score += 12*scale;
    if(q.line==="mid" && Math.abs(forward)<170*scale) score += 20*scale;
    if(score>bestScore){ bestScore=score; best=q; }
  }
  return best;
}

function handleUserActions(){
  const actions=[
    {team:"L", p:userPlayer("L"), c:cachedControlL},
    {team:"R", p:userPlayer("R"), c:cachedControlR}
  ];

  for(const it of actions){
    const p=it.p, c=it.c;

    if(c.slide) startSlide(p,c);

    const near = possession===p || dist2(p,ball)<(p.r+ball.r+20*scale)**2;
    if(c.pass && p.passCool<=0 && near && p.freeze<=0 && p.slideTime<=0){
      const t=passTarget(p);
      if(t) kickBall(p, 320*scale, t.x, t.y, .010*(p.team==="L"?1:-1));
      p.passCool=.42;
    }

    if(c.shoot && p.shootCool<=0 && near && p.freeze<=0 && p.slideTime<=0){
      const gx=oppGoalX(p.team) + attackDir(p.team)*45*scale;
      let gy=pitch.y+pitch.h/2 + c.y*pitch.h*.23;
      kickBall(p, 520*scale, gx, gy, .032*(Math.random()-.5));
      p.shootCool=.65;
    }
  }
}

function updateAIActions(dt){
  // AI ball carrier now acts toward the opponent goal.
  if(possession && possession!==userPlayer(possession.team)){
    const p=possession;
    p.aiDecisionCool=Math.max(0,p.aiDecisionCool-dt);
    const progress = p.team==="L" ? (p.x-pitch.x)/pitch.w : (pitch.x+pitch.w-p.x)/pitch.w;
    const closeOpp = nearestOpponentDistance(p) < 48*scale;

    if(p.aiDecisionCool<=0){
      if(progress>.78 || (progress>.68 && Math.abs(p.y-fieldY(.5))<pitch.h*.18)){
        kickBall(p, 500*scale, oppGoalX(p.team)+attackDir(p.team)*45*scale, fieldY(.5)+(Math.random()-.5)*pitch.h*.20, .02*(Math.random()-.5));
        p.aiDecisionCool=.9;
      } else if(closeOpp || Math.random()<.20){
        const t=passTarget(p);
        if(t){
          kickBall(p, 315*scale, t.x, t.y, .006*attackDir(p.team));
          p.aiDecisionCool=.7;
        }
      } else {
        p.aiDecisionCool=.35;
      }
    }
  }

  // Defensive AI slides only if near the ball carrier and in a dangerous area.
  if(!possession) return;
  const defendingTeam=otherTeam(possession.team);
  const defenders=teamPlayers(defendingTeam).filter(p=>p.role!=="GK" && p!==userPlayer(defendingTeam) && p.slideCool<=0 && p.freeze<=0);
  defenders.sort((a,b)=>dist2(a,possession)-dist2(b,possession));
  const p=defenders[0];
  if(!p) return;

  const danger = defendingTeam==="L" ? possession.x < fieldX(.38) : possession.x > fieldX(.62);
  const close = dist2(p,possession) < (46*scale)**2;
  if(danger && close && Math.random()<0.014){
    const d=normalize(possession.x-p.x,possession.y-p.y);
    startSlide(p,{x:d.x,y:d.y});
  }
}

function looseBallPhysics(dt){
  if(possession) return;
  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;
  ball.vx*=.987;
  ball.vy*=.987;
  ball.spin*=.982;
  ball.vy += ball.spin*15*scale;

  for(const p of players){
    const dx=ball.x-p.x,dy=ball.y-p.y;
    const d=Math.hypot(dx,dy)||1;
    const min=p.r+ball.r;
    if(d<min){
      const nx=dx/d,ny=dy/d;
      ball.x=p.x+nx*min; ball.y=p.y+ny*min;
      ball.vx += nx*82*scale + p.vx*.34;
      ball.vy += ny*82*scale + p.vy*.34;
    }
  }
}

function checkGoalAndBounds(){
  const goalTop=pitch.y+pitch.h*.42;
  const goalBottom=pitch.y+pitch.h*.58;

  if(ball.y<pitch.y+ball.r){ ball.y=pitch.y+ball.r; ball.vy*=-.78; possession=null; }
  if(ball.y>pitch.y+pitch.h-ball.r){ ball.y=pitch.y+pitch.h-ball.r; ball.vy*=-.78; possession=null; }

  if(ball.x<pitch.x+ball.r){
    if(ball.y>goalTop && ball.y<goalBottom){ scoreR++; kickoffTeam="L"; goal("RED GOAL"); }
    else { ball.x=pitch.x+ball.r; ball.vx*=-.78; possession=null; }
  }
  if(ball.x>pitch.x+pitch.w-ball.r){
    if(ball.y>goalTop && ball.y<goalBottom){ scoreL++; kickoffTeam="R"; goal("BLUE GOAL"); }
    else { ball.x=pitch.x+pitch.w-ball.r; ball.vx*=-.78; possession=null; }
  }
}

function goal(m){
  const sL=scoreL,sR=scoreR,t=timeLeft,ko=kickoffTeam;
  goalFlash=1.25;
  resetPositions();
  scoreL=sL;scoreR=sR;timeLeft=t;kickoffTeam=ko;
  setMessage(m,1.3);
}

function update(dt){
  if(!running) return;
  refreshControls();

  timeLeft-=dt;
  if(timeLeft<=0){ timeLeft=0; running=false; setMessage("FULL TIME",2); }

  messageTimer=Math.max(0,messageTimer-dt);
  goalFlash=Math.max(0,goalFlash-dt);
  consumeSwitches();

  for(const p of players){
    p.passCool=Math.max(0,p.passCool-dt);
    p.shootCool=Math.max(0,p.shootCool-dt);
    p.slideCool=Math.max(0,p.slideCool-dt);
  }

  handleUserActions();

  const lp=userPlayer("L"), rp=userPlayer("R");

  for(const p of players){
    // Only the selected player is directly controlled. If another AI player has possession,
    // it uses tactical AI instead of reading the keyboard, fixing the own-goal bug.
    if(p===lp && p!==possession || (p===lp && possession===p)){
      movePlayer(p,cachedControlL.x,cachedControlL.y,dt,true);
    } else if(p===rp && p!==possession || (p===rp && possession===p)){
      movePlayer(p,cachedControlR.x,cachedControlR.y,dt,true);
    } else {
      const t=tacticalTarget(p);
      movePlayer(p,(t.x-p.x)/(95*scale),(t.y-p.y)/(95*scale),dt,false);
    }
  }

  playerCollisions();
  updateAIActions(dt);
  handleSlideSteal();
  updatePossession();
  looseBallPhysics(dt);
  checkGoalAndBounds();
}

function rounded(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }

function drawPitch(){
  ctx.fillStyle="#10141b";
  ctx.fillRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#172b25");
  bg.addColorStop(.5,"#111822");
  bg.addColorStop(1,"#251a20");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  const grd=ctx.createLinearGradient(pitch.x,pitch.y,pitch.x,pitch.y+pitch.h);
  grd.addColorStop(0,"#2d8954");
  grd.addColorStop(1,"#1d6546");
  ctx.fillStyle=grd;
  rounded(pitch.x,pitch.y,pitch.w,pitch.h,16*scale);

  for(let i=0;i<12;i++){
    ctx.fillStyle=i%2 ? "rgba(255,255,255,.035)" : "rgba(0,0,0,.035)";
    ctx.fillRect(pitch.x+i*pitch.w/12,pitch.y,pitch.w/12,pitch.h);
  }

  ctx.strokeStyle="#252b33";
  ctx.lineWidth=12*scale;
  ctx.strokeRect(pitch.x,pitch.y,pitch.w,pitch.h);

  ctx.strokeStyle="rgba(255,255,255,.70)";
  ctx.lineWidth=2.5*scale;
  ctx.strokeRect(pitch.x,pitch.y,pitch.w,pitch.h);

  ctx.beginPath();
  ctx.moveTo(fieldX(.5),pitch.y);
  ctx.lineTo(fieldX(.5),pitch.y+pitch.h);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(fieldX(.5),fieldY(.5),58*scale,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeRect(pitch.x,fieldY(.27),pitch.w*.16,pitch.h*.46);
  ctx.strokeRect(pitch.x+pitch.w*.84,fieldY(.27),pitch.w*.16,pitch.h*.46);
  ctx.strokeRect(pitch.x,fieldY(.38),pitch.w*.055,pitch.h*.24);
  ctx.strokeRect(pitch.x+pitch.w*.945,fieldY(.38),pitch.w*.055,pitch.h*.24);

  ctx.fillStyle="rgba(255,255,255,.75)";
  ctx.beginPath(); ctx.arc(fieldX(.105),fieldY(.5),3*scale,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fieldX(.895),fieldY(.5),3*scale,0,Math.PI*2); ctx.fill();

  const gt=fieldY(.42), gh=pitch.h*.16;
  ctx.fillStyle="rgba(255,255,255,.18)";
  ctx.fillRect(pitch.x-12*scale,gt,18*scale,gh);
  ctx.fillRect(pitch.x+pitch.w-6*scale,gt,18*scale,gh);
}

function drawPlayer(p){
  const sel=userPlayer(p.team)===p;
  const c1=p.team==="L" ? "#207ef2" : "#e73448";
  const c2=p.team==="L" ? "#9bd0ff" : "#ffa0aa";

  ctx.save();
  ctx.translate(p.x,p.y);

  ctx.fillStyle="rgba(0,0,0,.27)";
  ctx.beginPath();
  ctx.ellipse(3*scale,10*scale,12*scale,4.5*scale,0,0,Math.PI*2);
  ctx.fill();

  if(sel){
    ctx.strokeStyle="rgba(255,255,255,.96)";
    ctx.lineWidth=2.7*scale;
    ctx.beginPath();
    ctx.ellipse(0,12*scale,17*scale,6.5*scale,0,0,Math.PI*2);
    ctx.stroke();
  }

  if(p.freeze>0){
    ctx.strokeStyle="rgba(180,230,255,.95)";
    ctx.lineWidth=2.2*scale;
    ctx.beginPath();
    ctx.arc(0,0,19*scale,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.rotate(p.facing);
  const run = p.slideTime>0 ? 0 : Math.sin(performance.now()*0.011+p.i);

  if(p.slideTime>0){
    ctx.strokeStyle="#1b222c";
    ctx.lineWidth=5*scale;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(-7*scale,4*scale); ctx.lineTo(15*scale,9*scale);
    ctx.moveTo(-5*scale,-2*scale); ctx.lineTo(14*scale,-9*scale);
    ctx.stroke();
    ctx.fillStyle=p.role==="GK" ? "#ffd84a" : c1;
    ctx.beginPath();
    ctx.roundRect(-13*scale,-7*scale,25*scale,14*scale,5*scale);
    ctx.fill();
    ctx.fillStyle="#f0c49a";
    ctx.beginPath(); ctx.arc(15*scale,-1*scale,5*scale,0,Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle="#1c222b";
    ctx.lineWidth=4.2*scale;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(-3.5*scale,6*scale); ctx.lineTo(-8*scale,(13+run*2)*scale);
    ctx.moveTo(3.5*scale,6*scale); ctx.lineTo(8*scale,(13-run*2)*scale);
    ctx.stroke();

    const g=ctx.createLinearGradient(-8*scale,-12*scale,10*scale,11*scale);
    g.addColorStop(0,c2); g.addColorStop(1,c1);
    ctx.fillStyle=p.role==="GK" ? "#ffd84a" : g;
    ctx.beginPath();
    ctx.roundRect(-8*scale,-9*scale,16*scale,18*scale,5*scale);
    ctx.fill();

    ctx.strokeStyle=p.role==="GK" ? "#ffd84a" : c1;
    ctx.lineWidth=3.4*scale;
    ctx.beginPath();
    ctx.moveTo(-8*scale,-3*scale); ctx.lineTo(-13*scale,(3-run)*scale);
    ctx.moveTo(8*scale,-3*scale); ctx.lineTo(13*scale,(3+run)*scale);
    ctx.stroke();

    ctx.fillStyle="#f0c49a";
    ctx.beginPath();
    ctx.arc(0,-16*scale,5.5*scale,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  if(possession===p){
    ctx.strokeStyle="rgba(255,255,255,.9)";
    ctx.lineWidth=2*scale;
    ctx.beginPath();
    ctx.arc(p.x,p.y,21*scale,0,Math.PI*2);
    ctx.stroke();
  }
}

function drawBall(){
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath();
  ctx.ellipse(ball.x+3*scale,ball.y+5*scale,ball.r*1.2,ball.r*.55,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#f8f8f2";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#222";
  ctx.lineWidth=1.5*scale;
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r*.52,0,Math.PI*2);
  ctx.stroke();
}

function drawHUD(){
  ctx.fillStyle="rgba(0,0,0,.55)";
  rounded(W/2-300*scale,7*scale,600*scale,50*scale,15*scale);
  ctx.fillStyle="#fff";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`900 ${27*scale}px sans-serif`;
  ctx.fillText(`${scoreL}  -  ${scoreR}`,W/2,32*scale);
  ctx.font=`800 ${14*scale}px sans-serif`;
  ctx.fillText("BLUE: WASD F/G Q/E",W/2-200*scale,32*scale);
  ctx.fillText("RED: ARROWS K/L O/P",W/2+200*scale,32*scale);
  ctx.fillText(`${Math.ceil(timeLeft)}s`,W/2+273*scale,32*scale);

  const rw=174*scale,rh=94*scale,rx=W/2-rw/2,ry=H-108*scale;
  ctx.fillStyle="rgba(0,0,0,.34)";
  rounded(rx,ry,rw,rh,12*scale);
  ctx.strokeStyle="rgba(255,255,255,.30)";
  ctx.lineWidth=1.3*scale;
  ctx.strokeRect(rx+8*scale,ry+8*scale,rw-16*scale,rh-16*scale);
  ctx.beginPath();
  ctx.moveTo(rx+rw/2,ry+8*scale); ctx.lineTo(rx+rw/2,ry+rh-8*scale); ctx.stroke();

  for(const p of players){
    ctx.fillStyle=p.team==="L" ? "#5daeff" : "#ff5c6b";
    if(p.freeze>0) ctx.fillStyle="#b8efff";
    ctx.beginPath();
    ctx.arc(rx+8*scale+(p.x-pitch.x)/pitch.w*(rw-16*scale),
            ry+8*scale+(p.y-pitch.y)/pitch.h*(rh-16*scale),
            p.role==="GK" ? 2.6*scale : 2.2*scale,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(rx+8*scale+(ball.x-pitch.x)/pitch.w*(rw-16*scale),
          ry+8*scale+(ball.y-pitch.y)/pitch.h*(rh-16*scale),
          2.5*scale,0,Math.PI*2);
  ctx.fill();

  if(messageTimer>0){
    ctx.fillStyle=`rgba(255,255,255,${Math.min(1,messageTimer)})`;
    ctx.font=`900 ${46*scale}px sans-serif`;
    ctx.fillText(message,W/2,H/2-10*scale);
  }

  if(goalFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${goalFlash*.16})`;
    ctx.fillRect(0,0,W,H);
  }

  if(!running && timeLeft<=0){
    ctx.fillStyle="rgba(0,0,0,.72)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";
    ctx.font=`900 ${52*scale}px sans-serif`;
    const r=scoreL===scoreR ? "DRAW" : (scoreL>scoreR ? "BLUE WINS" : "RED WINS");
    ctx.fillText(r,W/2,H/2-28*scale);
    ctx.font=`700 ${23*scale}px sans-serif`;
    ctx.fillText("再読み込みでリスタート",W/2,H/2+36*scale);
  }
}

function draw(){
  drawPitch();
  const sorted=[...players].sort((a,b)=>a.y-b.y);
  for(const p of sorted) drawPlayer(p);
  drawBall();
  drawHUD();
}

function loop(t){
  const dt=Math.min(.033,(t-last)/1000 || .016);
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
resetPositions();
</script>
</body>
</html>
